<style> body{font-family:Arial;padding:10px;background:#a51414} .phone{border-left:5px solid #000;padding:10px;margin:10px 0;background:white} .papa{border-color:blue} .mama{border-color:pink} .sis{border-color:purple} .grandma{border-color:green} .myphone{border-color:orange} input,select{padding:8px;margin:5px}</style>
</head><body>
<h2>SMS Dashboard - 5 Phones</h2>
<div id="login"><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button></div>
<div id="dash" style="display:none"><select id="filter" onchange="load()"><option value="">All Phones</option><option value="papa phone">Papa</option><option value="mama phone">Mama</option><option value="sis phone">Sis</option><option value="grandma phone">Grandma</option><option value="myphone">MyPhone</option></select> <button onclick="load()">Refresh</button><div id="msgs"></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getAuth, signInWithEmailAndPassword, onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {getFirestore, collection, query, orderBy, limit, getDocs} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDcuKtV0g7hhxUat_cJIwo_UiBHt5K9Cxk",authDomain:"sms-dashboard-38d9c.firebaseapp.com",projectId:"sms-dashboard-38d9c",storageBucket:"sms-dashboard-38d9c.firebasestorage.app",messagingSenderId:"539771188108",appId:"1:539771188108:web:33af8dc0f1da1bb1109ca9"};
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app);
window.login=()=>{signInWithEmailAndPassword(auth,email.value,pass.value).catch(e=>alert(e.message))};
onAuthStateChanged(auth,u=>{if(u){login.style.display='none';dash.style.display='block';load()}});
window.load=async()=>{const q=query(collection(db,"messages"),orderBy("timestamp","desc"),limit(100));const snap=await getDocs(q);let html="";snap.forEach(d=>{let m=d.data();if(filter.value && m.phoneId!=filter.value) return;html+=`<div class="phone ${m.phoneId.replace(' ','')}"><b>${m.phoneId}</b> | From: ${m.from}<br>${m.message}<br><small>${m.timestamp?.toDate?.()||'just now'}</small></div>`});msgs.innerHTML=html||"No SMS yet";};
</script></body></html>
